nombre: Atalaya Yoga y Pilates
eslogan: Estudio de yoga y pilates en el casco antiguo de Cartagena, a dos calles del puerto.
sector: yoga
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = nombre en texto.
colores:
  primario: "#44584a"
  acento: "#c9785b"
  fondo: "#f1e9dc"
  texto: "#2b2925"
contacto:
  telefono: "968 51 27 40"
  email: hola@atalayayoga.es
  direccion: Calle del Carmen 41, 30201 Cartagena (Murcia)
  horario: Lunes a viernes de 8:00 a 21:30. Sábados de 9:30 a 13:00.
  whatsapp: "+34 655 21 27 40"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
  - { texto: Clases, url: "/#clases" }
  - { texto: Horario, url: "/#horario" }
  - { texto: Tarifas, url: "/#tarifas" }
  - { texto: Profesoras, url: "/#profesores" }
